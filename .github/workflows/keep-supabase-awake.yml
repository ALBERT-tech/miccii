name: Keep Supabase Awake

# Будит бесплатную базу Supabase, чтобы она не засыпала после 7 дней простоя.
# Запуск каждые 2 дня + кнопка ручного запуска (вкладка Actions → Run workflow).

on:
  schedule:
    - cron: '17 6 */2 * *'   # каждые 2 дня, 06:17 UTC (≈09:17 МСК)
  workflow_dispatch: {}

permissions:
  contents: write            # чтобы коммитить метку времени

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Пинг Supabase REST API
        run: |
          echo "Дёргаем Supabase, чтобы сбросить таймер простоя"
          CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "https://btfqcxwbctbazgyomhjy.supabase.co/rest/v1/responses?select=id&limit=1" \
            -H "apikey: sb_publishable_LV6GidJ-BJT1v1ReNKaQVA_j_HGkxDh" \
            -H "Authorization: Bearer sb_publishable_LV6GidJ-BJT1v1ReNKaQVA_j_HGkxDh")
          echo "Ответ Supabase: HTTP $CODE"
          cat /tmp/resp.txt || true
          echo
          if [ "$CODE" = "000" ] || [ "$CODE" -ge 500 ]; then
            echo "::error::Supabase не ответил (HTTP $CODE)"
            exit 1
          fi

      - name: Обновить метку времени (держит крон живым)
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-ping.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive/last-ping.txt
          git commit -m "chore: keepalive $(date -u +%F)" || { echo "нет изменений"; exit 0; }
          git push
